services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terrain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrain_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-terrain_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrain_user} -d ${POSTGRES_DB:-terrain_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - local_data:/data
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-terrain_user}:${POSTGRES_PASSWORD:-terrain_secure_password}@db:5432/${POSTGRES_DB:-terrain_db}
      - STORAGE_DIR=/data
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
  local_data:
